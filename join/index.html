<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Join Sirkl</title>
  <style>
    :root {
      --teal: #2dd4bf;
      --teal-deep: #14b8a6;
      --navy: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --bg: #f8fafc;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      background:
        radial-gradient(1200px 500px at 50% -10%, rgba(45, 212, 191, 0.18), transparent 55%),
        var(--bg);
      color: var(--navy);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .brand {
      margin: 0 0 28px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--teal-deep);
    }

    .label {
      margin: 0 0 10px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--muted);
    }

    .code {
      margin: 0;
      padding: 18px 16px;
      border-radius: 18px;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
      font-size: clamp(2.4rem, 12vw, 3.6rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.14em;
      line-height: 1.1;
      word-break: break-all;
    }

    .instructions {
      margin: 18px 0 0;
      font-size: 1.05rem;
      line-height: 1.45;
      color: var(--navy);
    }

    .generic {
      margin: 8px 0 0;
      font-size: clamp(1.45rem, 6vw, 1.85rem);
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 28px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px 18px;
      border-radius: 14px;
      border: 1.5px solid var(--line);
      background: #fff;
      color: var(--navy);
      font: inherit;
      font-size: 1.02rem;
      font-weight: 600;
      line-height: 1.2;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }

    .btn:active {
      transform: scale(0.985);
    }

    .btn.primary {
      background: var(--teal);
      border-color: var(--teal);
      color: var(--navy);
      box-shadow: 0 10px 24px rgba(45, 212, 191, 0.35);
    }

    .btn.subdued {
      background: transparent;
      color: #334155;
      border-color: #cbd5e1;
    }

    .btn[hidden] {
      display: none;
    }

    .btn:focus-visible {
      outline: 3px solid rgba(45, 212, 191, 0.7);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">Sirkl</p>

    <section id="invite" hidden>
      <p class="label">Your Sirkl Invite Code</p>
      <p id="code" class="code"></p>
      <p class="instructions">Open the Sirkl app and enter this code to join.</p>
    </section>

    <p id="generic" class="instructions generic" hidden>Download the Sirkl app to get started</p>

    <div class="actions">
      <button id="join-btn" class="btn primary" type="button" hidden>Join Sirkl</button>
      <a id="ios-btn" class="btn subdued" href="https://apps.apple.com/us/app/sirkl-private-groups/id6781485563">Install for iPhone</a>
      <a id="android-btn" class="btn subdued" href="https://play.google.com/store/apps/details?id=com.sirkl.app&amp;pcampaignid=web_share">Install for Android</a>
    </div>
  </main>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = (params.get("code") || "").trim();
      var invite = document.getElementById("invite");
      var generic = document.getElementById("generic");

      if (code) {
        document.getElementById("code").textContent = code;
        invite.hidden = false;
        var joinBtn = document.getElementById("join-btn");
        joinBtn.hidden = false;
        joinBtn.addEventListener("click", function () {
          window.location.href = "sirkl://invite?token=" + code;
        });
      } else {
        generic.hidden = false;
      }

      var ua = navigator.userAgent || "";
      var platform = /android/i.test(ua) ? "android" : /iPad|iPhone|iPod/i.test(ua) ? "ios" : "other";
      var iosBtn = document.getElementById("ios-btn");
      var androidBtn = document.getElementById("android-btn");

      if (platform === "ios") {
        androidBtn.hidden = true;
      } else if (platform === "android") {
        iosBtn.hidden = true;
      }
    })();
  </script>
</body>
</html>
