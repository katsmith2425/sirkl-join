<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="robots" content="noindex">
  <title>Page not found – Sirkl</title>
  <link rel="icon" href="/assets/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal: #2dd4bf;
      --teal-deep: #14b8a6;
      --navy: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --bg: #f8fafc;
      --white: #fff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      overflow-x: clip;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background:
        radial-gradient(1100px 560px at 50% -80px, rgba(45, 212, 191, 0.2), transparent 62%),
        var(--bg);
      color: var(--navy);
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a:focus-visible {
      outline: 3px solid rgba(45, 212, 191, 0.7);
      outline-offset: 3px;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }

    .nav-inner {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 24px;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--navy);
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      text-decoration: none;
      line-height: 1;
    }

    .brand img {
      display: block;
      width: auto;
      height: 40px;
    }

    .nav-links {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .nav-links a {
      color: var(--navy);
      font-size: 0.95rem;
      font-weight: 500;
      text-decoration: none;
    }

    .nav-links a:hover {
      color: var(--teal-deep);
    }

    .nav-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border-radius: 999px;
      background: var(--navy);
      color: var(--white);
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
    }

    .nav-cta:hover {
      background: #1e293b;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 72px 20px 88px;
      text-align: center;
    }

    .missing {
      margin: 0;
      color: var(--teal);
      font-size: 96px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    h1 {
      margin: 16px 0 0;
      scroll-margin-top: 85px;
      color: var(--navy);
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }

    .missing-note {
      max-width: 420px;
      margin: 16px auto 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.6;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 28px;
      padding: 14px 22px;
      border-radius: 999px;
      background: var(--navy);
      color: var(--white);
      font-size: 16px;
      font-weight: 600;
      line-height: 1;
      text-decoration: none;
    }

    .home-btn:hover {
      background: #1e293b;
    }

    .site-footer {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 20px 48px;
    }

    .site-footer-inner {
      border-top: 1px solid var(--line);
      padding-top: 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 8px;
    }

    .footer-links a {
      color: var(--muted);
      text-decoration: none;
    }

    .footer-links a:hover {
      color: var(--teal-deep);
    }

    .copyright {
      margin: 8px 0 0;
    }

    @media (max-width: 720px) {
      .nav-inner {
        padding: 12px 20px;
      }

      .nav-links {
        display: none;
      }
    }

    @media (min-width: 768px) {
      main {
        padding: 96px 24px 120px;
      }

      h1 {
        font-size: 40px;
      }

      .site-footer {
        padding: 0 24px 64px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="nav-inner">
      <a class="brand" href="https://sirkl.app/">
        <img src="/assets/logo2.png" alt="Sirkl" width="96" height="40">
      </a>
      <nav class="nav-links" aria-label="Primary">
        <a href="https://sirkl.app/#features">Features</a>
        <a href="https://sirkl.app/#pricing">Pricing</a>
        <a href="https://sirkl.app/#faq">FAQ</a>
      </nav>
      <a class="nav-cta" href="https://sirkl.app/#get-started">Get the app</a>
    </div>
  </header>

  <main>
    <p class="missing">404</p>
    <h1>This page wandered off.</h1>
    <p class="missing-note">The page you're looking for doesn't exist or has moved.</p>
    <a class="home-btn" href="https://sirkl.app/">Back to home</a>
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <nav class="footer-links" aria-label="Footer">
        <a href="/privacy">Privacy</a>
        <span aria-hidden="true">·</span>
        <a href="/terms">Terms</a>
        <span aria-hidden="true">·</span>
        <a href="/safety">Safety</a>
        <span aria-hidden="true">·</span>
        <a href="/">Home</a>
      </nav>
      <p class="copyright">© 2026 Sirkl</p>
    </div>
  </footer>
</body>
</html>
